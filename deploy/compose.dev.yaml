name: receipt-tracker-dev
services:
  db:
    image: postgres:18.4-alpine3.23
    environment:
      POSTGRES_USER: receipt
      POSTGRES_PASSWORD: receipt
      POSTGRES_DB: receipt_tracker
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./init-test-db.sql:/docker-entrypoint-initdb.d/01-test.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'pg_isready -U receipt -d receipt_tracker && psql -U receipt -d receipt_tracker_test -c "SELECT 1" >/dev/null',
        ]
      interval: 2s
      timeout: 5s
      retries: 30
    command:
      ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=20"]
volumes:
  postgres-data:
