version: "3"

env:
  GOTOOLCHAIN: go1.26.11

vars:
  TEST_DATABASE_URL: '{{default "postgres://receipt:receipt@localhost:15432/receipt_tracker_test?sslmode=disable" .TEST_DATABASE_URL}}'

tasks:
  setup:
    desc: Install pinned tools and frontend dependencies
    cmds:
      - go mod download
      - npm --prefix web ci
      - node web/scripts/tasks.mjs install-lint
  db:up:
    desc: Start development and test Postgres databases
    cmds:
      - docker compose -f deploy/compose.dev.yaml up -d --wait
  dev:
    desc: Run the server and web app with reload
    cmds:
      - node web/scripts/tasks.mjs dev
  server:
    desc: Build and run the server with .env and optional arguments
    cmds:
      - node web/scripts/tasks.mjs embed
      - node web/scripts/server-dev.mjs {{.CLI_ARGS}}
  generate:
    desc: Regenerate database and API bindings when their sources exist
    cmds:
      - node web/scripts/tasks.mjs generate
  lint:
    desc: Lint and format-check Go and web
    cmds:
      - node web/scripts/tasks.mjs embed
      - node web/scripts/tasks.mjs lint-go
      - npm --prefix web run lint
      - npm --prefix web run typecheck
  test:
    desc: Run Go and web tests against the test database
    env:
      TEST_DATABASE_URL: "{{.TEST_DATABASE_URL}}"
    cmds:
      - npm --prefix web run build
      - node web/scripts/tasks.mjs embed
      # Bound simultaneous pools below the development database's 20 connections.
      - go test -p 2 ./cmd/... ./internal/...
      - npm --prefix web test
  build:
    desc: Build the embedded web application and server binary
    cmds:
      - npm --prefix web run build
      - node web/scripts/tasks.mjs embed
      - go build -trimpath -ldflags="-s -w" -o bin/ ./cmd/server
  backup:test:
    desc: Test dump and restore against isolated PostgreSQL with real client tools
    cmds:
      - defer: docker compose -f deploy/compose.backup-test.yaml down --volumes
      - docker compose -f deploy/compose.backup-test.yaml run --build --rm tests
  resources:
    desc: Measure isolated container memory with ten synthetic 12 MP JPEG and HEIC uploads
    cmds:
      - docker build -f deploy/Dockerfile -t receipt-tracker:resources .
      - node web/scripts/measure-resources.mjs
  audit:
    desc: Scan Go and production web dependencies for vulnerabilities
    cmds:
      - go run golang.org/x/vuln/cmd/govulncheck@latest -show verbose ./...
      - npm --prefix web audit --omit=dev
  e2e:
    desc: Exercise the real server over HTTP and validate every API response
    env:
      TEST_DATABASE_URL: "{{.TEST_DATABASE_URL}}"
    cmds:
      - task: build
      - go test -tags=e2e -count=1 -timeout=5m ./cmd/server
  check:
    desc: Check generated drift, lint, test, and build
    cmds:
      - task: generate
      - node web/scripts/tasks.mjs drift
      - task: lint
      - task: test
      - task: build
