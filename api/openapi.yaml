      properties:
        from:
          $ref: "#/components/schemas/Month"
        to:
          $ref: "#/components/schemas/Month"
        months:
          type: array
          description: Every month of the range, oldest first.
          items:
            $ref: "#/components/schemas/MonthSpending"
        excludedReceipts:
          type: integer
          description: Receipts left out because they have no date or no total.
          minimum: 0
    MonthSpending:
      type: object
      required: [month, totals]
      properties:
        month:
          $ref: "#/components/schemas/Month"
        totals:
          type: array
          description: One entry per currency spent in; empty for a month without receipts.
          items:
            $ref: "#/components/schemas/CurrencyTotal"
    CurrencyTotal:
      type: object
      required: [currency, amount, receiptCount]
      properties:
        currency:
          $ref: "#/components/schemas/Currency"
        amount:
          $ref: "#/components/schemas/Money"
        receiptCount:
          type: integer
          minimum: 1
    BreakdownGrouping:
      type: string
      enum: [category, store]
    MonthBreakdown:
      type: object
      required: [month, groupBy, currencies, excludedReceipts]
      properties:
        month:
          $ref: "#/components/schemas/Month"
        groupBy:
          $ref: "#/components/schemas/BreakdownGrouping"
        currencies:
          type: array
          description: One breakdown per currency spent in; empty for a month without receipts.
          items:
            $ref: "#/components/schemas/CurrencyBreakdown"
        excludedReceipts:
          type: integer
          description: Receipts of the user left out because they have no date or no total.
          minimum: 0
    CurrencyBreakdown:
      type: object
      required: [currency, total, groups]
      properties:
        currency:
          $ref: "#/components/schemas/Currency"
        total:
          description: The month's total in this currency; the groups add up to it.
          allOf:
            - $ref: "#/components/schemas/Money"
        groups:
          type: array
          description: Largest amount first.
          items:
            $ref: "#/components/schemas/BreakdownGroup"
    BreakdownGroupKind:
      type: string
      description: |
        - `category`, `store`: a real category or store, named by `id`.
        - `uncategorised`: spending without a category (or, by store, without a store).
        - `unallocated`: the part of receipt totals that the lines do not account for.
      enum: [category, store, uncategorised, unallocated]
    BreakdownGroup:
      type: object
      required: [kind, id, name, amount, share, itemCount]
      properties:
        kind:
          $ref: "#/components/schemas/BreakdownGroupKind"
        id:
          type: string
          format: uuid
          nullable: true
          description: Id of the category or store; `null` for the other kinds.
        name:
          type: string
          description: Display name of the group.
        amount:
          $ref: "#/components/schemas/Money"
        share:
          description: Part of the currency's total.
          allOf:
            - $ref: "#/components/schemas/Ratio"
        itemCount:
          type: integer
          description: Number of line items in the group, or of receipts when grouping by store.
          minimum: 0
    Settings:
      type: object
      required: [defaultCurrency, defaultReceiptTitle]
      properties:
        defaultCurrency:
          description: Currency given to a receipt that does not state one.
          allOf:
            - $ref: "#/components/schemas/Currency"
        defaultReceiptTitle:
          type: string
          description: Title given to an uploaded receipt.
          minLength: 1
          maxLength: 200
    ExtractionProvider:
      type: string
      description: What reads receipt images on this instance.
      enum: [azure, fake]
    Usage:
      type: object
      required: [provider, period, pagesUsed, pagesLimit]
      properties:
        provider:
          $ref: "#/components/schemas/ExtractionProvider"
        period:
          description: The current month, in UTC.
          allOf:
            - $ref: "#/components/schemas/Month"
        pagesUsed:
          type: integer
          minimum: 0
        pagesLimit:
          type: integer
          minimum: 1
    StorageBackend:
      type: string
      description: Where receipt images are kept.
      enum: [local, drive]
    DriveState:
      type: string
      description: |
        - `ok`: connected and usable.
        - `not_connected`: Drive is needed but nobody has connected it.
        - `reconnect_needed`: the stored authorization no longer works; connect again.
        - `not_required`: neither images nor backups use Drive.
      enum: [ok, not_connected, reconnect_needed, not_required]
    BackupDestination:
      type: string
      description: Where database backups go; `none` when backups are off.
      enum: [drive, local, none]
    BackupStatus:
      type: object
      required: [destination, lastSuccessAt, lastError]
      properties:
        destination:
          $ref: "#/components/schemas/BackupDestination"
        lastSuccessAt:
          type: string
          format: date-time
          nullable: true
          description: When a backup last succeeded; `null` when none has.
        lastError:
          type: string
          nullable: true
          description: Stable reason code of the last failed run; `null` when the last run succeeded or none ran.
          pattern: '^[a-z][a-z0-9_]*$'
    StorageStatus:
      type: object
      required: [backend, drive, lastError, canManage, backup]
      properties:
        backend:
          $ref: "#/components/schemas/StorageBackend"
        drive:
          $ref: "#/components/schemas/DriveState"
        lastError:
          type: string
          nullable: true
          description: Stable reason code of the last storage failure; `null` when there is none.
          pattern: '^[a-z][a-z0-9_]*$'
        canManage:
          type: boolean
          description: Whether this user may connect and disconnect Google Drive.
        backup:
          $ref: "#/components/schemas/BackupStatus"
